<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ReVogue — SECOND HAND. FIRST CHOICE.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
/* NEW GREEN AESTHETIC THEME */
--bg:#081a17; 
--card:#10211d;
--muted:#b2c3be;
--accent:#5cc4a8; /* Primary Green/Teal */
--accent-2:#73e8bf; /* Lighter Accent */
--glass: rgba(255,255,255,0.03);
--glass-2: rgba(255,255,255,0.02);
--success:#66e07f;
--danger:#ff7a7a;
--radius:12px;
--max-width:1200px;
}
*{box-sizing:border-box}
body{
margin:0;
background: linear-gradient(180deg, #071513 0%, var(--bg) 100%);
color:#eaf6f7;font-family:Inter,system-ui,Arial;
-webkit-font-smoothing:antialiased;
padding:28px;
display:flex;justify-content:center;
}
.app{width:100%;max-width:var(--max-width)}
header{
display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
display:flex;align-items:center;justify-content:center;font-weight:800;color:#031310;font-family:Lora;font-size:20px;transform:rotate(-8deg);
box-shadow:0 8px 30px rgba(92,196,168,0.08);
}
.brand .title{line-height:1}
.brand h1{margin:0;font-size:18px}
.brand p{margin:0;font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600}
nav a.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#031310}
.controls{display:flex;gap:8px;align-items:center}
.btn{
background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px 12px;border-radius:10px;color:var(--accent-2);cursor:pointer;font-weight:700;
}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#031310;border:none}
main{display:block;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); padding:20px;border-radius:14px;box-shadow:0 10px 40px rgba(5,10,16,0.6)}
.container{max-width:var(--max-width);margin:0 auto}
.grid{display:grid;gap:16px}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.card{
background:linear-gradient(180deg,var(--card), rgba(255,255,255,0.01));
padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);
}
.product-img{width:100%;height:180px;border-radius:10px;background-size:cover;background-position:center;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:13px;color:var(--muted)}
.price{font-weight:800;font-size:18px}
.life-meter{height:10px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:8px;overflow:hidden;margin-top:8px}
.life-meter > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:40%}
.flex{display:flex;gap:8px;align-items:center}
.space-between{display:flex;justify-content:space-between;align-items:center}
form label{display:block;font-size:13px;margin:8px 0 6px;color:var(--muted)}
input[type="text"], input[type="number"], textarea, select{
width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:inherit;font-size:14px;
}
.hint{font-size:12px;color:var(--muted)}
footer{margin-top:20px;color:var(--muted);font-size:13px;text-align:center}

/* responsive */
@media (max-width:900px){
.grid.cols-3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:580px){
header{flex-direction:column;align-items:flex-start}
.grid.cols-3{grid-template-columns:1fr}
nav{width:100%;display:flex;overflow:auto}
}

/* small UI niceties */
.badge{background:rgba(255,255,255,0.03);padding:6px 8px;border-radius:8px;color:var(--muted);font-weight:700}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .val{font-weight:800;font-size:18px}
.center{display:flex;align-items:center;justify-content:center}
.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.02);font-weight:700}
.community-post img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.tips-list li{margin:8px 0}
.search{display:flex;gap:8px}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.02);font-weight:700;color:var(--muted)}
.secondary{background:transparent;border:1px dashed rgba(255,255,255,0.03)}
.form-row{display:flex;gap:8px}
.form-row > *{flex:1}
.small-muted{font-size:12px;color:var(--muted)}
.linkish{color:var(--accent-2);cursor:pointer;text-decoration:underline}

/* Refurbish Tracker */
.tracker-container{display:flex;justify-content:space-between;margin-top:10px;position:relative;padding-top:20px;}
.tracker-step{width:25%;text-align:center;position:relative}
.tracker-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.1);border:3px solid var(--card);position:absolute;top:0;left:50%;transform:translate(-50%,-50%);}
.tracker-step.active .tracker-dot{background:var(--accent)}
.tracker-step-title{font-size:11px;color:var(--muted);margin-top:10px;position:absolute;width:100%;left:0;font-weight:700}
.tracker-line{height:3px;background:rgba(255,255,255,0.1);position:absolute;top:3px;left:0;right:0;z-index:-1;}
.tracker-progress{height:3px;background:var(--accent);position:absolute;top:3px;left:0;z-index:-1;width:0}

/* Goal Progress Bar */
.goal-bar{height:10px;background:var(--glass-2);border-radius:5px;margin-top:4px}
.goal-progress{height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));border-radius:5px;}

/* Modal Styling */
#modalOverlay{
    position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
}
#modalOverlay .modal-content{
    max-width:600px;width:100%;
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">
<div class="logo">Rv</div>
<div class="title">
<h1>ReVogue</h1>
<p class="muted">SECOND HAND. FIRST CHOICE.</p>
</div>
</div>

<nav id="navlinks">
<a href="#home" data-route="home" class="active">Home</a>
<a href="#shop" data-route="shop">Shop</a>
<a href="#wardrobe" data-route="wardrobe">Wardrobe</a>
<a href="#rebox" data-route="rebox">ReBox</a>
<a href="#dashboard" data-route="dashboard">Dashboard</a>
<a href="#redeem" data-route="redeem">Redeem ⭐</a>
<a href="#community" data-route="community">ReCommunity</a>
<a href="#tips" data-route="tips">Tips</a>
<a href="#about" data-route="about">About</a>
</nav>

<div class="controls">
<div class="chip">⭐ RePoints: <strong id="rePointsCount">${loadData().rePoints || 0}</strong></div>
<button class="btn" id="seedBtn" title="Reset all data">Reset</button>
<button class="btn primary" id="newItemBtn">+ Add Closet Item</button>
</div>
</header>

<main id="appMain" class="container">
</main>

<footer>
Built with love by the ReVogue Team — data stored locally (localStorage). </footer>
</div>

<script>
/* -------------------------
App: data + routing + render
-------------------------*/

const ROUTES = ['home','shop','wardrobe','rebox','dashboard','redeem','community','tips','about'];
const sampleProducts = [
{id: 'p1', title: 'Vintage Denim Jacket', price: 85, img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=687', life: 65, cycles: 18, fabric: 'Organic cotton denim. Washed in low-impact process. Origin: Turkey.', saved_water_liters: 1200, co2_saved_kg: 18, care:'Machine wash cold, delicate cycle. Air dry to maintain shape. Avoid bleach.'},
{id: 'p2', title: 'Hand-dyed Silk Blouse', price: 40, img: 'https://images.unsplash.com/photo-1596752763328-b9a3f2c53f3e?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 30, cycles: 6, fabric: 'Mulberry silk. Artisan-dyed in India. Low-waste dyeing.', saved_water_liters: 250, co2_saved_kg: 3.8, care:'Hand wash only in cold water with mild detergent. Lay flat to dry. Do not wring.'},
{id: 'p3', title: 'Reworked Cotton Trousers', price: 90, img: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd4?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 85, cycles: 32, fabric: 'Recycled cotton panels. Honest craftsmanship.', saved_water_liters: 3000, co2_saved_kg: 42, care:'Machine wash warm. Tumble dry medium. Iron inside out.'},
{id: 'p4', title: 'Chunky Knit Cardigan', price: 55, img: 'https://images.unsplash.com/photo-1608688460676-0f8c37d0c3f0?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 50, cycles: 12, fabric: 'Blend: organic wool & recycled fibers. Made in Portugal.', saved_water_liters: 900, co2_saved_kg: 12, care:'Hand wash or dry clean. Store folded (do not hang). Treat pilling gently with a sweater comb.'},
{id: 'p5', title: 'Upcycled Patchwork Skirt', price: 70, img: 'https://images.unsplash.com/photo-1596707323204-629a997d519d?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 40, cycles: 8, fabric: 'Mixed cotton scraps, fully traceable.', saved_water_liters: 600, co2_saved_kg: 8, care:'Gentle machine wash, low spin. Iron on low setting.'},
{id: 'p6', title: 'Bamboo T-Shirt (Grey)', price: 30, img: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 75, cycles: 25, fabric: '100% Organic Bamboo Viscose.', saved_water_liters: 400, co2_saved_kg: 5, care:'Wash on cold. Tumble dry low or hang dry. Bamboo fibers are naturally anti-bacterial.'},
{id: 'p7', title: 'Linen Maxi Dress (Natural)', price: 110, img: 'https://images.unsplash.com/photo-1563836374028-2b8969317528?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 90, cycles: 40, fabric: 'European Flax Linen, highly durable.', saved_water_liters: 1500, co2_saved_kg: 20, care:'Linen softens with washing. Wash on delicate. Do not over-dry. Accept the wrinkles!'},
{id: 'p8', title: 'Organic Cotton Hoodie', price: 95, img: 'https://images.unsplash.com/photo-1578351717316-6c16723f66c1?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 95, cycles: 50, fabric: 'GOTS certified Organic Cotton.', saved_water_liters: 300, co2_saved_kg: 4, care:'Machine wash cold with like colours. Hang to dry to minimize shrinkage.'},
{id: 'p9', title: 'Recycled Cashmere Sweater', price: 180, img: 'https://images.unsplash.com/photo-1596752763328-b9a3f2c53f3e?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 60, cycles: 15, fabric: '100% Recycled Cashmere.', saved_water_liters: 800, co2_saved_kg: 15, care:'Hand wash cold with wool/cashmere detergent. Lay flat away from sunlight to dry.'},
{id: 'p10', title: 'Recycled Fiber T-Shirt', price: 35, img: 'https://images.unsplash.com/photo-1588820087794-d2e1b1248a3d?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', life: 70, cycles: 28, fabric: '50% recycled cotton, 50% recycled PET.', saved_water_liters: 1800, co2_saved_kg: 25, care:'Wash on cold, gentle cycle. Avoid fabric softeners.'},
];

const REBOX_TIERS = [
    {id:'rb1', title:'Monthly ReBox', price:45, frequency:'Monthly', points:50, img:'https://images.unsplash.com/photo-1520038410233-a3d13550e502?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', note:'Curated selection of items ready for sale/upcycle.'},
    {id:'rb2', title:'Quarterly ReBox', price:120, frequency:'Quarterly', points:150, img:'https://images.unsplash.com/photo-1601334927233-a3d13550e502?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', note:'Larger collection, includes premium refurbish vouchers.'},
    {id:'rb3', title:'Yearly ReBox', price:450, frequency:'Yearly', points:500, img:'https://images.unsplash.com/photo-1612450849610-d9225c56d252?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D', note:'Best value, priority service, and biggest impact.'},
];

const REDEEM_OPTIONS = [
    {id:'r1', type:'voucher', name:'10% Shop Discount', points:200, reward:'10% OFF any Shop Item', action: (state) => { alert('10% Voucher Redeemed!'); state.rePoints -= 200; }},
    {id:'r2', type:'donation', name:'Plant a Tree', points:50, reward:'Plant one extra tree on your behalf.', action: (state) => { state.trees += 1; state.rePoints -= 50; alert('1 Tree Planted! Thank you for your impact.'); }},
    {id:'r3', type:'tips', name:'Premium Stain Removal Guide', points:100, reward:'Unlock Advanced Care Tips', action: (state) => { alert('Premium Tip Unlocked!'); state.tips.push({id:uid('t'), title:'PREMIUM: Coffee Stain Removal', body:'Use a solution of vinegar and rubbing alcohol. Dab, do not rub!'}); state.rePoints -= 100; }},
];

// Refurbish status steps for tracker
const REFURB_STEPS = ['Requested', 'Shipped to Atelier', 'In Repair', 'Ready'];

const DEFAULT_TIPS = [
{id:'t1', title:'Wash less, smell fresh', body:'Wash clothes only when needed; air garments and spot-clean to extend life.'},
{id:'t2', title:'Cold water for colored garments', body:'Cold water preserves dyes and reduces energy usage.'},
{id:'t3', title:'Mend small holes early', body:'Repairing small rips right away prevents bigger damage.'},
{id:'t4', title:'Use a laundry bag', body:'Protect delicate fabrics and reduce pilling.'},
{id:'t5', title:'Store with cedar', body:'Cedar wood keeps moths away and smells natural.'}
];

// localStorage keys
const KEY = 'revogue_final_submission'; 

// initialize storage if empty
function seedData(){
const base = {
products: sampleProducts,
wardrobe: [
    {...sampleProducts[0], location:'wardrobe', qty:1, id:uid('w')}, 
    {...sampleProducts[3], location:'wardrobe', qty:1, id:uid('w')}
],
rebox: [
    {...sampleProducts[1], price: 35, boxDeal: 'ReBox - Ready', note: 'Ready for sale', qty:1, id:uid('w')}
],
refurbRequests: [
    {id:uid('r'), itemTitle:sampleProducts[0].title, type:'mend', when: Date.now(), status:'Requested', statusIndex: 0},
    {id:uid('r'), itemTitle:sampleProducts[3].title, type:'re-dye', when: Date.now() - (1000*60*60*24), status:'In Repair', statusIndex: 2},
],
community: [
{id:'c1', user:'Aisha', text:'Restyled my denim jacket — turned it into a shacket! Love the refurbish service.', img:'https://images.unsplash.com/photo-1546525848-3ce03ca516f6?q=80&w=400&auto=format&fit=crop&ixlib=rb-4.0.3&s=7a9b4a317b6d7f3e', time: Date.now()-1000*60*60*24}
],
subscriptions: [],
trees: 23,
donations: 12,
rePoints: 350, 
tips: DEFAULT_TIPS,
goals: {
    refurbGoal: {target: 3, current: 1}, 
    pointsGoal: {target: 1000, current: 350} 
}
};
localStorage.setItem(KEY, JSON.stringify(base));
return base;
}
function loadData(){
const raw = localStorage.getItem(KEY);
if(!raw) return seedData();
try{ return JSON.parse(raw); } catch(e){ return seedData(); }
}
function saveData(data){ 
    localStorage.setItem(KEY, JSON.stringify(data)); 
    const rePointsEl = document.getElementById('rePointsCount');
    if(rePointsEl) rePointsEl.textContent = state.rePoints;
}

/* App state */
let state = loadData();

/* Helpers */
function $(sel){ return document.querySelector(sel); }
function q(sel, el=document){ return el.querySelector(sel); }
function formatPrice(n){ return 'QAR ' + n.toFixed(2); }
function uid(prefix='id'){ return prefix + Math.random().toString(36).slice(2,9); }
function humanTime(ts){
const d = Date.now()-ts;
const mins = Math.round(d/60000);
if(mins < 60) return mins + 'm';
const hrs = Math.round(mins/60);
if(hrs < 24) return hrs + 'h';
const days = Math.round(hrs/24);
return days + 'd';
}

/* Router */
function routeTo(page){
if(!ROUTES.includes(page)) page='home';
window.location.hash = '#'+page;
render();
}
window.addEventListener('hashchange', render);

/* UI actions */
document.getElementById('seedBtn').addEventListener('click', ()=>{
if(confirm('Reset all data? This will clear any changes.')) {
seedData();
state = loadData();
render();
}
});
document.getElementById('newItemBtn').addEventListener('click', ()=>{
routeTo('wardrobe');
setTimeout(()=>{ window.scrollTo({top:0, behavior:'smooth'}); }, 120);
});

/* initial nav active */
function setActiveNav(route){
document.querySelectorAll('#navlinks a').forEach(a=>{
a.classList.toggle('active', a.getAttribute('data-route') === route);
});
}

/* Rendering pages */
function render(){
const main = document.getElementById('appMain');
const hash = (window.location.hash || '#home').replace('#','');
setActiveNav(hash);
if(!ROUTES.includes(hash)) return routeTo('home');

// Update RePoints count on every render
const rePointsEl = document.getElementById('rePointsCount');
if(rePointsEl) rePointsEl.textContent = state.rePoints;

if(hash==='home') return renderHome(main);
if(hash==='shop') return renderShop(main);
if(hash==='wardrobe') return renderWardrobe(main);
if(hash==='rebox') return renderRebox(main);
if(hash==='dashboard') return renderDashboard(main);
if(hash==='redeem') return renderRedeem(main);
if(hash==='community') return renderCommunity(main);
if(hash==='tips') return renderTips(main);
if(hash==='about') return renderAbout(main);
}

/* Calculator Logic */
const AVG_WATER_SAVED = 2700; // Liters for a new garment
const AVG_CO2_SAVED = 33; // kg for a new garment
function updateCalculatorDisplay(cycles){
    const cyclesNum = Number(cycles) || 1;
    const water = Math.round(AVG_WATER_SAVED * (cyclesNum / 10)); 
    const co2 = (AVG_CO2_SAVED * (cyclesNum / 10)).toFixed(1);

    const waterEl = document.getElementById('calcWater');
    const co2El = document.getElementById('calcCO2');
    const cyclesHintEl = document.getElementById('calcCyclesHint');

    if(waterEl && co2El && cyclesHintEl){
        waterEl.textContent = water.toLocaleString();
        co2El.textContent = co2;
        cyclesHintEl.textContent = cyclesNum;
    }
}


/* ---------- HOME ---------- */
function renderHome(root){
root.innerHTML = `
<section class="grid" style="grid-template-columns:1fr 420px;gap:20px">
<div>
<div class="card">
<h2>SECOND HAND. FIRST CHOICE.</h2>
<p class="muted">ReVogue — a platform combining resale, refurbish, subscription care and community. Explore: add items to your **Wardrobe**, request refurbish, join **ReBox**, and track your impact.</p>
<div style="margin-top:12px" class="flex">
<button class="btn primary" onclick="routeTo('shop')">Shop</button>
<button class="btn" onclick="routeTo('wardrobe')">My Wardrobe</button>
<div style="flex:1"></div>
<div class="chip">🌳 Trees planted: <strong id="treeCount">${state.trees}</strong></div>
</div>
</div>

<div style="margin-top:14px" class="card">
    <h4>Quick Footprint Calculator</h4>
    <div class="muted">Estimate your environmental savings by extending the life of a garment instead of buying new.</div>
    <label style="margin-top:10px">How many extra cycles (wears) will you get?</label>
    <input type="number" id="calcCycles" value="10" min="1" max="500" />
    
    <div style="margin-top:10px;text-align:center;padding:10px;border-radius:8px;background:var(--glass-2)">
        <div class="small-muted">Estimated Savings (for <strong id="calcCyclesHint">10</strong> extra cycles)</div>
        <div style="font-weight:900;font-size:20px;margin-top:4px;color:var(--accent-2)">
            <span id="calcWater">2,700</span> L Water & 
            <span id="calcCO2">33.0</span> kg CO₂
        </div>
    </div>
</div>

<div style="margin-top:14px" class="card">
<h3>Featured ReBox Subscription</h3>
<div style="display:flex;gap:12px;align-items:center;margin-top:8px">
<div style="width:100px;height:100px;background-image:url('${REBOX_TIERS[1].img}');background-size:cover;border-radius:10px"></div>
<div>
<div style="font-weight:800">${REBOX_TIERS[1].title}</div>
<div class="muted">${REBOX_TIERS[1].note}</div>

</div>
</div>
</div>

<div style="margin-top:12px" class="grid cols-2">
    <div class="card">
        <h4>🎯 My Sustainability Goals</h4>
        ${renderGoal('refurbGoal', 'Refurbish Requests this Year', state.goals.refurbGoal.current, state.goals.refurbGoal.target)}
        ${renderGoal('pointsGoal', 'Earn RePoints Total', state.goals.pointsGoal.current, state.goals.pointsGoal.target)}
        <div style="margin-top:10px" class="small-muted">Keep making sustainable choices to hit your goals!</div>
    </div>

<h4>Refurbish Requests Tracker</h4>
<div id="refurbList" style="margin-top:8px"></div>
</div>
`;

// Render goals helper
function renderGoal(key, title, current, target) {
    const progress = Math.min(100, (current / target) * 100);
    const complete = current >= target ? ' (COMPLETE!)' : '';
    return `
        <div style="margin-bottom:12px; padding-bottom: 8px; border-bottom: 1px solid var(--glass-2);">
            <div style="font-weight:700">${title}${complete}</div>
            <div class="small-muted">${current} / ${target}</div>
            <div class="goal-bar"><div class="goal-progress" style="width:${progress}%"></div></div>
        </div>
    `;
}

// refurb list
const rlist = root.querySelector('#refurbList');
rlist.innerHTML = state.refurbRequests.length ? state.refurbRequests.map(r=>{
    const progressIndex = r.statusIndex || 0;
    const progressWidth = (progressIndex / (REFURB_STEPS.length - 1)) * 100;
    return `
        <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.02)">
            <div style="font-weight:800">${r.itemTitle || r.itemId} - ${r.type}</div>
            <div class="small-muted">Status: ${r.status}</div>
            
            <div class="tracker-container">
                <div class="tracker-line"></div>
                <div class="tracker-progress" style="width:${progressWidth}%"></div>
                ${REFURB_STEPS.map((step, index) => `
                    <div class="tracker-step ${index <= progressIndex ? 'active' : ''}">
                        <div class="tracker-dot"></div>
                        <div class="tracker-step-title" style="transform: translateX(${index===0 ? '-50%' : index === REFURB_STEPS.length - 1 ? '-50%' : '-50%'})">${step}</div>
                    </div>
                `).join('')}
            </div>
            <div style="margin-top:40px;text-align:right;">
                <button class="btn" onclick="updateRefurbStatus('${r.id}')">Advance Status</button>
            </div>
        </div>
    `;
}).join('') : '<div class="muted">No refurbish requests yet.</div>';

// subs
const sl = root.querySelector('#subList');
sl.innerHTML = state.subscriptions.length ? state.subscriptions.map(s=>`
<div style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.02)">
<div style="font-weight:800">${s.plan} (${s.type})</div>
<div class="small-muted">${s.name} • ${new Date(s.when).toLocaleDateString()}</div>
</div>
`).join('') : '<div class="muted">No subscriptions yet.</div>';
}

function updateRefurbStatus(id){
    const req = state.refurbRequests.find(r => r.id === id);
    if (!req) return;

    req.statusIndex = (req.statusIndex + 1) % REFURB_STEPS.length;
    req.status = REFURB_STEPS[req.statusIndex];

    if (req.status === 'Ready') {
        state.rePoints += 100; // Reward for successful completion
        alert(`Refurbish Complete! ${req.itemTitle} is ready. Earned 100 RePoints!`);
    }

    saveData(state);
    render();
}

saveData(state); render();
});
}

/* ---------- About ---------- */
function renderAbout(root){
root.innerHTML = `
<div class="card">
<h3>About ReVogue</h3>
<p class="muted">ReVogue is a platform showcasing a circular fashion experience: resale, refurbishment, subscription care, and community. The goal is to reduce waste, extend garment life, and support ethical production.</p>
<h4 style="margin-top:12px">Key Features</h4>
<ul class="muted">
<li>Life Meter — shows garment cycles and sustainability score.</li>
<li>Refurbish Requests — doorstep pickup & repairs with a Visual Tracker on the Dashboard).</li>
<li>ReCare Subscription — monthly care with repairs & discounts.</li>
<li>ReBox Tiers — curated seasonal boxes on monthly, quarterly, or yearly basis.</li>
<li>Fabric Story Tags — origin, material, and footprint info.</li>
<li>RePoints — rewards for sustainable choices and engagement, spendable in the Redeem Center.</li>
</ul>
<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn primary" onclick="routeTo('shop')">See Shop</button>
<button class="btn" onclick="routeTo('dashboard')">Impact Dashboard</button>
</div>
</div>
`;
}

/* ---------- Product / Refurb flows ---------- */
function openDetail(id){
const p = state.products.find(x=>x.id===id);
if(!p) return alert('Not found');
const html = `
<div class="card modal-content">
<div style="display:flex;gap:20px">
<div style="width:200px;height:200px;background-image:url('${p.img}');background-size:cover;background-position:center;border-radius:12px;flex-shrink:0;"></div>
<div style="flex:1">
<h3>${p.title}</h3>
<div class="muted" style="margin-top:-10px">${p.fabric}</div>
<div style="margin-top:10px" class="price">${formatPrice(p.price)}</div>
<div style="margin-top:10px">
<div class="small-muted">Life Remaining: <strong style="color:var(--accent-2);">${p.life}%</strong></div>
<div class="life-meter"><i style="width:${p.life}%"></i></div>
</div>
</div>
</div>

<h4 style="margin-top:15px">Sustainability Footprint</h4>
<div class="grid cols-3" style="font-weight:700">
    <div>${p.cycles} cycles</div>
    <div>${p.saved_water_liters} L Water Saved</div>
    <div>${p.co2_saved_kg} kg CO₂ Offset</div>
</div>

<h4 style="margin-top:15px">Care Instructions</h4>
<div class="muted">${p.care || 'No specific care instructions provided.'}</div>


<div style="margin-top:20px;display:flex;gap:8px">
<button class="btn primary" onclick="addToWardrobe('${p.id}'); closeModal();">Add to Wardrobe</button>
<button class="btn" onclick="openRefurbForm('${p.id}'); closeModal();">Refurbish</button>
<button class="btn" onclick="closeModal()">Close</button>
</div>
</div>
`;
showModal(html);
}

function openRefurbForm(itemId, itemObj){
const item = itemObj || state.products.find(x=>x.id===itemId) || state.wardrobe.find(x=>x.id===itemId) || {title:'Custom item'};
const html = `
<div class="card modal-content">
<h3>Refurbish Request — ${item.title}</h3>
<div class="muted">Choose what you need: mend, recolor, restyle or upcycle. Submitting will advance your refurbishment goal.</div>
<form id="refurbForm">
<label>Service type</label>
<select id="refurbType">
<option value="mend">Mend a tear</option>
<option value="restitch">Restitch / Replace Zipper</option>
<option value="re-dye">Re-dye / Recolor</option>
<option value="upcycle">Upcycle into accessory</option>
<option value="full-restyle">Full restyle</option>
</select>
<label>Notes</label>
<textarea id="refurbNote" rows="3" placeholder="Describe condition, size, color, timeline"></textarea>
<div style="margin-top:8px;display:flex;gap:8px">
<button class="btn primary" type="submit">Send Request</button>
<button class="btn" type="button" onclick="closeModal()">Cancel</button>
</div>
</form>
</div>
`;
showModal(html);
document.getElementById('refurbForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const type = document.getElementById('refurbType').value;
    const note = document.getElementById('refurbNote').value.trim();
    
    // Add new request
    state.refurbRequests.push({id:uid('r'), itemId:item.id, itemTitle:item.title, type, note, when: Date.now(), status:'Requested', statusIndex:0});
    
    // Update Goals and RePoints
    state.rePoints += 50; 
    state.goals.refurbGoal.current++;
    
    saveData(state);
    closeModal();
    alert('Refurbish request sent for ' + item.title + '. You earned 50 RePoints and advanced your goal!');
    render();
});
}

/* ---------- Modal Logic (Minimal) ---------- */
function showModal(content){
    let overlay = document.getElementById('modalOverlay');
    if(!overlay){
        overlay = document.createElement('div');
        overlay.id = 'modalOverlay';
        // Styles are in CSS block now
        document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="modal-content">${content}</div>`;
    overlay.style.display = 'flex';
}
function closeModal(){
    const modal = document.getElementById('modalOverlay');
    if(modal) modal.style.display = 'none';
}

// Initial render
render();
</script>
</body>
</html>
