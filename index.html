<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ReVogue — SECOND HAND. FIRST CHOICE.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
/* NEW GREEN AESTHETIC THEME */
--bg:#081a17; 
--card:#10211d;
--muted:#b2c3be;
--accent:#5cc4a8; /* Primary Green/Teal */
--accent-2:#73e8bf; /* Lighter Accent */
--glass: rgba(255,255,255,0.03);
--glass-2: rgba(255,255,255,0.02);
--success:#66e07f;
--danger:#ff7a7a;
--radius:12px;
--max-width:1200px;
}
*{box-sizing:border-box}
body{
margin:0;
background: linear-gradient(180deg, #071513 0%, var(--bg) 100%);
color:#eaf6f7;font-family:Inter,system-ui,Arial;
-webkit-font-smoothing:antialiased;
padding:28px;
display:flex;justify-content:center;
}
.app{width:100%;max-width:var(--max-width)}
header{
display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
display:flex;align-items:center;justify-content:center;font-weight:800;color:#031310;font-family:Lora;font-size:20px;transform:rotate(-8deg);
box-shadow:0 8px 30px rgba(92,196,168,0.08);
}
.brand .title{line-height:1}
.brand h1{margin:0;font-size:18px}
.brand p{margin:0;font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600}
nav a.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#031310}
.controls{display:flex;gap:8px;align-items:center}
.btn{
background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px 12px;border-radius:10px;color:var(--accent-2);cursor:pointer;font-weight:700;
}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#031310;border:none}
main{display:block;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); padding:20px;border-radius:14px;box-shadow:0 10px 40px rgba(5,10,16,0.6)}
.container{max-width:var(--max-width);margin:0 auto}
.grid{display:grid;gap:16px}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.card{
background:linear-gradient(180deg,var(--card), rgba(255,255,255,0.01));
padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);
}
.product-img{width:100%;height:180px;border-radius:10px;background-size:cover;background-position:center;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:13px;color:var(--muted)}
.price{font-weight:800;font-size:18px}
.life-meter{height:10px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:8px;overflow:hidden;margin-top:8px}
.life-meter > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:40%}
.flex{display:flex;gap:8px;align-items:center}
.space-between{display:flex;justify-content:space-between;align-items:center}
form label{display:block;font-size:13px;margin:8px 0 6px;color:var(--muted)}
input[type="text"], input[type="number"], textarea, select{
width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:inherit;font-size:14px;
}
.hint{font-size:12px;color:var(--muted)}
footer{margin-top:20px;color:var(--muted);font-size:13px;text-align:center}

/* responsive */
@media (max-width:900px){
.grid.cols-3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:580px){
header{flex-direction:column;align-items:flex-start}
.grid.cols-3{grid-template-columns:1fr}
nav{width:100%;display:flex;overflow:auto}
}

/* small UI niceties */
.badge{background:rgba(255,255,255,0.03);padding:6px 8px;border-radius:8px;color:var(--muted);font-weight:700}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .val{font-weight:800;font-size:18px}
.center{display:flex;align-items:center;justify-content:center}
.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.02);font-weight:700}
.community-post img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.tips-list li{margin:8px 0}
.search{display:flex;gap:8px}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.02);font-weight:700;color:var(--muted)}
.secondary{background:transparent;border:1px dashed rgba(255,255,255,0.03)}
.form-row{display:flex;gap:8px}
.form-row > *{flex:1}
.small-muted{font-size:12px;color:var(--muted)}
.linkish{color:var(--accent-2);cursor:pointer;text-decoration:underline}

/* Refurbish Tracker */
.tracker-container{display:flex;justify-content:space-between;margin-top:10px;position:relative;padding-top:20px;}
.tracker-step{width:25%;text-align:center;position:relative}
.tracker-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.1);border:3px solid var(--card);position:absolute;top:0;left:50%;transform:translate(-50%,-50%);}
.tracker-step.active .tracker-dot{background:var(--accent)}
.tracker-step-title{font-size:11px;color:var(--muted);margin-top:10px;position:absolute;width:100%;left:0;font-weight:700}
.tracker-line{height:3px;background:rgba(255,255,255,0.1);position:absolute;top:3px;left:0;right:0;z-index:-1;}
.tracker-progress{height:3px;background:var(--accent);position:absolute;top:3px;left:0;z-index:-1;width:0}

/* Goal Progress Bar */
.goal-bar{height:10px;background:var(--glass-2);border-radius:5px;margin-top:4px}
.goal-progress{height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));border-radius:5px;}

/* Modal Styling */
#modalOverlay{
    position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
}
#modalOverlay .modal-content{
    max-width:600px;width:100%;
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">
<div class="logo">Rv</div>
<div class="title">
<h1>ReVogue</h1>
<p class="muted">SECOND HAND. FIRST CHOICE.</p>
</div>
</div>

<nav id="navlinks">
<a href="#home" data-route="home" class="active">Home</a>
<a href="#shop" data-route="shop">Shop</a>
<a href="#wardrobe" data-route="wardrobe">Wardrobe</a>
<a href="#rebox" data-route="rebox">ReBox</a>
<a href="#dashboard" data-route="dashboard">Dashboard</a>
<a href="#redeem" data-route="redeem">Redeem ⭐</a>
<a href="#community" data-route="community">ReCommunity</a>
<a href="#tips" data-route="tips">Tips</a>
<a href="#about" data-route="about">About</a>
</nav>

<div class="controls">
<div class="chip">⭐ RePoints: <strong id="rePointsCount">${loadData().rePoints || 0}</strong></div>
<button class="btn" id="seedBtn" title="Reset all data">Reset</button>
<button class="btn primary" id="newItemBtn">+ Add Closet Item</button>
</div>
</header>

<main id="appMain" class="container">
</main>

<footer>
Built with love by the ReVogue Team — data stored locally (localStorage). </footer>
</div>

<script>
/* -------------------------
App: data + routing + render
-------------------------*/

// Repository name prefix for GitHub Pages: /ReVogue-sustainable/

const ROUTES = ['home','shop','wardrobe','rebox','dashboard','redeem','community','tips','about'];
// FIXED: All local image paths now correctly use the /ReVogue-sustainable/assets/images/ prefix.
const sampleProducts = [
{id: 'p1', title: 'Vintage Denim Jacket', price: 85, img: '/ReVogue-sustainable/assets/images/denim_jacket.jpg', life: 65, cycles: 18, fabric: 'Organic cotton denim. Washed in low-impact process. Origin: Turkey.', saved_water_liters: 1200, co2_saved_kg: 18, care:'Machine wash cold, delicate cycle. Air dry to maintain shape. Avoid bleach.'},
{id: 'p2', title: 'Hand-dyed Silk Blouse', price: 40, img: '/ReVogue-sustainable/assets/images/silk_blouse.jpg', life: 30, cycles: 6, fabric: 'Mulberry silk. Artisan-dyed in India. Low-waste dyeing.', saved_water_liters: 250, co2_saved_kg: 3.8, care:'Hand wash only in cold water with mild detergent. Lay flat to dry. Do not wring.'},
{id: 'p3', title: 'Reworked Cotton Trousers', price: 90, img: '/ReVogue-sustainable/assets/images/cotton_trousers.jpg', life: 85, cycles: 32, fabric: 'Recycled cotton panels. Honest craftsmanship.', saved_water_liters: 3000, co2_saved_kg: 42, care:'Machine wash warm. Tumble dry medium. Iron inside out.'},
{id: 'p4', title: 'Chunky Knit Cardigan', price: 55, img: '/ReVogue-sustainable/assets/images/chunky_cardigan.jpg', life: 50, cycles: 12, fabric: 'Blend: organic wool & recycled fibers. Made in Portugal.', saved_water_liters: 900, co2_saved_kg: 12, care:'Hand wash or dry clean. Store folded (do not hang). Treat pilling gently with a sweater comb.'},
{id: 'p5', title: 'Upcycled Patchwork Skirt', price: 70, img: '/ReVogue-sustainable/assets/images/patchwork_skirt.jpg', life: 40, cycles: 8, fabric: 'Mixed cotton scraps, fully traceable.', saved_water_liters: 600, co2_saved_kg: 8, care:'Gentle machine wash, low spin. Iron on low setting.'},
{id: 'p6', title: 'Bamboo T-Shirt (Grey)', price: 30, img: '/ReVogue-sustainable/assets/images/bamboo_tshirt.jpg', life: 75, cycles: 25, fabric: '100% Organic Bamboo Viscose.', saved_water_liters: 400, co2_saved_kg: 5, care:'Wash on cold. Tumble dry low or hang dry. Bamboo fibers are naturally anti-bacterial.'},
{id: 'p7', title: 'Linen Maxi Dress (Natural)', price: 110, img: '/ReVogue-sustainable/assets/images/linen_dress.jpg', life: 90, cycles: 40, fabric: 'European Flax Linen, highly durable.', saved_water_liters: 1500, co2_saved_kg: 20, care:'Linen softens with washing. Wash on delicate. Do not over-dry. Accept the wrinkles!'},
{id: 'p8', title: 'Organic Cotton Hoodie', price: 95, img: '/ReVogue-sustainable/assets/images/cotton_hoodie.jpg', life: 95, cycles: 50, fabric: 'GOTS certified Organic Cotton.', saved_water_liters: 300, co2_saved_kg: 4, care:'Machine wash cold with like colours. Hang to dry to minimize shrinkage.'},
{id: 'p9', title: 'Recycled Cashmere Sweater', price: 180, img: '/ReVogue-sustainable/assets/images/cashmere_sweater.jpg', life: 60, cycles: 15, fabric: '100% Recycled Cashmere.', saved_water_liters: 800, co2_saved_kg: 15, care:'Hand wash cold with wool/cashmere detergent. Lay flat away from sunlight to dry.'},
{id: 'p10', title: 'Recycled Fiber T-Shirt', price: 35, img: '/ReVogue-sustainable/assets/images/recycled_tshirt.jpg', life: 70, cycles: 28, fabric: '50% recycled cotton, 50% recycled PET.', saved_water_liters: 1800, co2_saved_kg: 25, care:'Wash on cold, gentle cycle. Avoid fabric softeners.'},
];

const REBOX_TIERS = [
 // FIXED: ReBox image path corrected
 {id:'rb1', title:'Monthly ReBox', price:45, frequency:'Monthly', points:50, img:'/ReVogue-sustainable/assets/images/rebox.jpg', note:'Curated selection of items ready for sale/upcycle.'},
 {id:'rb2', title:'Quarterly ReBox', price:120, frequency:'Quarterly', points:150, img:'/ReVogue-sustainable/assets/images/rebox.jpg', note:'Curated selection of items ready for sale/upcycle.'},
 {id:'rb3', title:'Yearly ReBox', price:450, frequency:'Yearly', points:600, img:'/ReVogue-sustainable/assets/images/rebox.jpg', note:'Curated selection of items ready for sale/upcycle.'},
];


const initialData = {
    // Setting initial products based on the fixed list
    products: sampleProducts, 
    wardrobe: [],
    refurbRequests: [],
    community: [],
    tips: [
        {id:'t1', title:'Cold Wash Saves Energy', body:'Washing clothes on cold uses significantly less energy, preventing color fading and extending fabric life.'},
        {id:'t2', title:'Air Dry for Longevity', body:'Avoid the dryer when possible. Tumble drying weakens fibers over time. Air drying preserves shape and energy.'},
        {id:'t3', title:'Treat Stains Immediately', body:'Don\'t let stains set. Gently spot clean as soon as possible before a full wash.'}
    ],
    rePoints: 100,
    goals: {
        refurbGoal: {
            title: 'Refurbish 3 Items',
            target: 3,
            current: 0,
            reward: 200
        },
        wearGoal: {
            title: 'Wear 10 Items 5+ Times',
            target: 10,
            current: 0,
            reward: 300
        }
    },
    subscriptions: []
};

function uid(prefix = 'id') {
    return prefix + Math.random().toString(36).substring(2, 9);
}

function saveData(data) {
    localStorage.setItem('revogueState', JSON.stringify(data));
}

function loadData() {
    const data = localStorage.getItem('revogueState');
    if (data) {
        // When loading, make sure to integrate the latest product list (for new users)
        let loadedState = JSON.parse(data);
        loadedState.products = sampleProducts;
        return loadedState;
    }
    return initialData;
}

let state = loadData();

// Helper functions for rendering and routing
function formatPrice(price) {
    return `₹${price}`; // Assuming Indian Rupees
}

function humanTime(timestamp) {
    const now = Date.now();
    const diff = now - timestamp;
    const minutes = Math.floor(diff / (1000 * 60));
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    if (minutes < 60) return `${minutes} min`;
    if (hours < 24) return `${hours} hr`;
    return `${days} day`;
}

// Router/Renderer
const appMain = document.getElementById('appMain');
const navlinks = document.getElementById('navlinks');

function routeTo(route) {
    // 1. Update URL hash
    window.location.hash = route;

    // 2. Update active link in navigation
    navlinks.querySelectorAll('a').forEach(link => {
        if (link.dataset.route === route) {
            link.classList.add('active');
        } else {
            link.classList.remove('active');
        }
    });

    // 3. Render content
    render();
}

function render() {
    const route = window.location.hash.substring(1) || 'home';
    const pointsCount = document.getElementById('rePointsCount');
    if(pointsCount) pointsCount.innerHTML = state.rePoints || 0;

    // Ensure the current route is valid, default to home
    const currentRoute = ROUTES.includes(route) ? route : 'home';
    // FIX: Removed recursive routeTo call that caused the infinite loop

    appMain.innerHTML = '';
    
    switch (currentRoute) {
        case 'home':
            renderHome(appMain);
            break;
        case 'shop':
            renderShop(appMain);
            break;
        case 'wardrobe':
            renderWardrobe(appMain);
            break;
        case 'rebox':
            renderReBox(appMain);
            break;
        case 'dashboard':
            renderDashboard(appMain);
            break;
        case 'redeem':
            renderRedeem(appMain);
            break;
        case 'community':
            renderCommunity(appMain);
            break;
        case 'tips':
            renderTips(appMain);
            break;
        case 'about':
            renderAbout(appMain);
            break;
        default:
            renderHome(appMain);
    }
}

// Helper functions for various pages (keeping logic minimal)

/* ---------- Home ---------- */
function renderHome(root) {
    root.innerHTML = `
        <div class="grid cols-3">
            <div class="card">
                <h3>Circular Fashion</h3>
                <div class="muted">ReVogue is your marketplace for second-hand items and sustainable re-commerce services.</div>
                <div style="margin-top:10px;display:flex;gap:8px">
                    <button class="btn primary" onclick="routeTo('shop')">Shop Now</button>
                    <button class="btn" onclick="routeTo('rebox')">Get a ReBox</button>
                </div>
            </div>
            <div class="card">
                <h3>My Impact</h3>
                <div class="kpi"><span class="val">${state.wardrobe.length}</span> items in my wardrobe</div>
                <div class="kpi" style="margin-top:8px"><span class="val">${state.refurbRequests.length}</span> refurbish requests sent</div>
                <div style="margin-top:10px">
                    <button class="btn primary" onclick="routeTo('dashboard')">View Dashboard</button>
                </div>
            </div>
            <div class="card">
                <h3>ReCommunity</h3>
                <div class="muted">Join discussions, share your sustainable style, and get repair tips.</div>
                <div style="margin-top:10px">
                    <button class="btn primary" onclick="routeTo('community')">Join the Feed</button>
                </div>
            </div>
        </div>
        
        <div style="margin-top:20px" class="card">
            <h4>Featured Products</h4>
            <div class="grid cols-3" style="margin-top:10px" id="featuredProducts">
                
            </div>
        </div>
    `;

    const featured = root.querySelector('#featuredProducts');
    featured.innerHTML = state.products.slice(0, 3).map(p => `
        <div class="card" onclick="openDetail('${p.id}')">
            <div class="product-img" style="background-image:url('${p.img}')"></div>
            <div>${p.title}</div>
            <div class="price">${formatPrice(p.price)}</div>
            <div class="life-meter" title="Life Remaining: ${p.life}%"><i style="width:${p.life}%"></i></div>
        </div>
    `).join('');
}


/* ---------- Shop ---------- */
function renderShop(root) {
    root.innerHTML = `
        <div class="card">
            <h3>Sustainable Marketplace</h3>
            <div class="muted">Every item has a 'Fabric Story' and a 'Life Meter' to track its sustainability impact.</div>
            <div style="margin-top:12px">
                <div class="search">
                    <input type="text" id="productSearch" placeholder="Search product name or fabric (e.g. Linen, Denim)" />
                </div>
            </div>
        </div>
        
        <div style="margin-top:12px" class="grid cols-3" id="productList">
        </div>
    `;
    
    const list = root.querySelector('#productList');
    const searchInput = root.querySelector('#productSearch');

    function renderList(filter = '') {
        const filteredProducts = state.products.filter(p => 
            p.title.toLowerCase().includes(filter) || p.fabric.toLowerCase().includes(filter)
        );
        list.innerHTML = filteredProducts.map(p => `
            <div class="card" onclick="openDetail('${p.id}')">
                <div class="product-img" style="background-image:url('${p.img}')"></div>
                <div class="space-between">
                    <div>${p.title}</div>
                    <div class="price">${formatPrice(p.price)}</div>
                </div>
                <div class="small">Life: <strong style="color:var(--accent-2);">${p.life}%</strong></div>
                <div class="life-meter" title="Life Remaining: ${p.life}%"><i style="width:${p.life}%"></i></div>
            </div>
        `).join('');
    }

    renderList();
    searchInput.addEventListener('input', (e) => renderList(e.target.value.trim().toLowerCase()));
}

/* ---------- Wardrobe ---------- */
function renderWardrobe(root) {
    root.innerHTML = `
        <div class="card">
            <h3>My Digital Wardrobe (${state.wardrobe.length} Items)</h3>
            <div class="muted">Track the wear and care cycles of your items. Manage refurbishment requests here.</div>
            <button class="btn secondary" style="margin-top:10px" onclick="openRefurbForm(uid('new'), {title:'New Item'})">+ Add Non-Marketplace Item</button>
        </div>
        
        <div style="margin-top:12px" class="grid cols-2" id="wardrobeList">
        </div>
    `;

    const list = root.querySelector('#wardrobeList');

    function renderList() {
        if(state.wardrobe.length === 0){
            list.innerHTML = '<div class="card" style="grid-column: span 2;text-align:center">Your wardrobe is empty. Add items from the Shop or manually add new items.</div>';
            return;
        }

        list.innerHTML = state.wardrobe.map(item => `
            <div class="card" style="display:flex;gap:12px">
                <div style="width:100px;height:100px;background-image:url('${item.img}');background-size:cover;background-position:center;border-radius:8px;flex-shrink:0;"></div>
                <div style="flex:1">
                    <div style="font-weight:900">${item.title}</div>
                    <div class="small">Worn: <strong>${item.worn || 0} times</strong> | Life: <strong>${item.life}%</strong></div>
                    <div class="life-meter"><i style="width:${item.life}%"></i></div>
                    <div style="margin-top:10px;display:flex;gap:6px">
                        <button class="btn primary" onclick="wearItem('${item.id}')">Worn!</button>
                        <button class="btn" onclick="openRefurbForm('${item.id}')">Refurbish</button>
                        <button class="btn" onclick="removeItem('${item.id}')">Remove</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    renderList();
}

function addToWardrobe(id) {
    const p = state.products.find(x => x.id === id);
    if (p && !state.wardrobe.find(x => x.id === id)) {
        state.wardrobe.push({ ...p, worn: 0 });
        saveData(state);
        alert(`${p.title} added to your wardrobe!`);
    } else {
        alert('Item is already in your wardrobe.');
    }
    render();
}

function wearItem(id) {
    const item = state.wardrobe.find(x => x.id === id);
    if (item) {
        item.worn = (item.worn || 0) + 1;
        item.life = Math.max(0, item.life - 1); // Decrease life slightly
        state.rePoints += 5; // Reward for wearing
        
        // Check for wear goal completion (simple check for items worn 5+ times)
        const wornFivePlus = state.wardrobe.filter(i => (i.worn || 0) >= 5).length;
        if(wornFivePlus >= state.goals.wearGoal.target && state.goals.wearGoal.current < state.goals.wearGoal.target){
            state.goals.wearGoal.current = state.goals.wearGoal.target; // Simple completion flag
            state.rePoints += state.goals.wearGoal.reward;
            alert(`Goal Complete! Earned ${state.goals.wearGoal.reward} RePoints!`);
        }


        saveData(state);
        alert(`Worn ${item.title}! You earned 5 RePoints.`);
    }
    render();
}

function removeItem(id){
    if(confirm('Are you sure you want to remove this item?')){
        state.wardrobe = state.wardrobe.filter(x => x.id !== id);
        saveData(state);
        render();
    }
}

function openRefurbForm(itemId, item = null) {
    item = item || state.wardrobe.find(x => x.id === itemId);
    if (!item) {
        alert("Item not found in wardrobe.");
        return;
    }
    
    const isNewItem = itemId.startsWith('new');
    const title = isNewItem ? 'Add New Item' : `Refurbish ${item.title}`;
    
    const formHtml = `
        <h3>${title}</h3>
        <p class="muted">${isNewItem ? 'Enter details for a non-marketplace item.' : 'Request professional refurbishment services.'}</p>
        
        <label for="refurbTitle">Item Name</label>
        <input type="text" id="refurbTitle" value="${item.title}" ${isNewItem ? '' : 'disabled'} required>
        
        <label for="refurbService">Service Type</label>
        <select id="refurbService" required>
            <option value="repair">Basic Repair (${formatPrice(15)})</option>
            <option value="upcycle">Full Upcycle/Redesign (${formatPrice(50)})</option>
            <option value="cleaning">Deep Cleaning (${formatPrice(10)})</option>
        </select>
        
        <label for="refurbNotes">Notes (Damage description or redesign ideas)</label>
        <textarea id="refurbNotes" rows="4"></textarea>

        <div style="margin-top:20px;display:flex;gap:10px">
            <button class="btn primary" onclick="submitRefurbRequest('${itemId}', ${isNewItem})">${isNewItem ? 'Add Item' : 'Submit Request'}</button>
            <button class="btn secondary" onclick="closeModal()">Cancel</button>
        </div>
    `;
    showModal(formHtml);
}

function submitRefurbRequest(itemId, isNewItem) {
    const title = document.getElementById('refurbTitle').value;
    const service = document.getElementById('refurbService').value;
    const notes = document.getElementById('refurbNotes').value;

    if (isNewItem) {
        state.wardrobe.push({
            id: uid('p'),
            title: title,
            price: 0, 
            img: '/ReVogue-sustainable/assets/images/placeholder.jpg', 
            life: 100, 
            cycles: 0,
            worn: 0,
            fabric: 'User Added Item',
            saved_water_liters: 0,
            co2_saved_kg: 0,
            care: 'N/A'
        });
        alert(`${title} added to your wardrobe!`);
    } else {
        const item = state.wardrobe.find(x => x.id === itemId);
        if (item) {
            state.refurbRequests.push({
                id: uid('r'),
                itemId: itemId,
                itemTitle: item.title,
                service: service,
                notes: notes,
                timestamp: Date.now(),
                status: 'Requested',
                statusIndex: 1
            });
            state.goals.refurbGoal.current = state.refurbRequests.length;
            if(state.refurbRequests.length >= state.goals.refurbGoal.target) {
                 state.rePoints += state.goals.refurbGoal.reward;
                 alert(`Goal Complete! Earned ${state.goals.refurbGoal.reward} RePoints!`);
            }
            alert(`Refurbishment request for ${title} submitted!`);
        }
    }
    saveData(state);
    closeModal();
    render();
}


/* ---------- ReBox ---------- */
function renderReBox(root) {
    const isSubscribed = state.subscriptions.includes('rebox');
    
    root.innerHTML = `
        <div class="card">
            <h3>ReBox Subscription</h3>
            <div class="muted">Get a curated box of second-hand or upcycled items sent to your door. Great for reducing decision fatigue and supporting circularity.</div>
            <div style="margin-top:10px">
                ${isSubscribed 
                    ? `<span class="pill">SUBSCRIBED</span> <span class="small-muted">You are currently receiving the ${state.subscriptions.find(s=>s.includes('rb')) || 'Monthly'} ReBox.</span>`
                    : `<span class="pill secondary">NOT SUBSCRIBED</span>`}
            </div>
            ${isSubscribed ? `<button class="btn danger" style="margin-top:10px" onclick="unsubscribe('rebox')">Cancel Subscription</button>` : ''}
        </div>
        
        <div style="margin-top:12px" class="grid cols-3">
            ${REBOX_TIERS.map(tier => `
                <div class="card">
                    <div style="background-image:url('${tier.img}');height:120px;background-size:cover;background-position:center;border-radius:8px;margin-bottom:10px"></div>
                    <h4>${tier.title}</h4>
                    <div class="price">${formatPrice(tier.price)} <span class="small-muted">/${tier.frequency.toLowerCase()}</span></div>
                    <div class="muted" style="margin-top:6px">${tier.note}</div>
                    <div style="margin-top:10px">
                        ${isSubscribed && state.subscriptions.includes(tier.id) 
                            ? `<button class="btn primary" disabled>Current Tier</button>` 
                            : `<button class="btn primary" onclick="subscribe('${tier.id}')">Subscribe (${tier.points} Points)</button>`}
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function subscribe(tierId){
    const tier = REBOX_TIERS.find(t=>t.id === tierId);
    if(tier && state.rePoints >= tier.points){
        state.rePoints -= tier.points;
        state.subscriptions = state.subscriptions.filter(s=>!s.startsWith('rb')); // Remove existing tier
        state.subscriptions.push(tierId);
        saveData(state);
        alert(`Subscribed to ${tier.title}! Used ${tier.points} RePoints.`);
    } else if (tier) {
        alert('Not enough RePoints to subscribe to this tier!');
    }
    render();
}

function unsubscribe(type){
    if(confirm(`Are you sure you want to cancel your ${type} subscription?`)){
        state.subscriptions = state.subscriptions.filter(s=>!s.includes(type));
        saveData(state);
        alert(`${type} subscription cancelled.`);
        render();
    }
}


/* ---------- Dashboard ---------- */
function renderDashboard(root) {
    const refurbGoal = state.goals.refurbGoal;
    const wearGoal = state.goals.wearGoal;
    const refurbProgress = Math.min(100, (refurbGoal.current / refurbGoal.target) * 100);

    const totalWorn = state.wardrobe.reduce((sum, item) => sum + (item.worn || 0), 0);
    const totalWaterSaved = state.wardrobe.reduce((sum, item) => sum + (item.saved_water_liters || 0), 0);
    const totalCO2Saved = state.wardrobe.reduce((sum, item) => sum + (item.co2_saved_kg || 0), 0);

    const trackerProgress = Math.min(100, (state.refurbRequests.reduce((sum, r) => sum + r.statusIndex, 0) / (state.refurbRequests.length * 3 || 1)) * 100);
    
    root.innerHTML = `
        <h3>My Impact Dashboard</h3>
        
        <div class="grid cols-3">
            <div class="card">
                <h4>Total Wardrobe Impact (Carbon Footprint/WaterCalc)</h4>
                <div class="kpi"><span class="val">${totalWorn}</span> Total Wears</div>
                <div class="kpi" style="margin-top:8px"><span class="val">${totalWaterSaved} L</span> Water Saved</div>
                <div class="kpi" style="margin-top:8px"><span class="val">${totalCO2Saved} kg</span> CO₂ Offset</div>
            </div>
            <div class="card" style="grid-column: span 2">
                <h4>Refurbishment Tracker (Refurb Requests)</h4>
                <div class="muted">Last Request: <strong>${state.refurbRequests[state.refurbRequests.length-1]?.itemTitle || 'None'}</strong> | Status: <strong>${state.refurbRequests[state.refurbRequests.length-1]?.status || 'N/A'}</strong></div>
                
                <div class="tracker-container">
                    <div class="tracker-line"></div>
                    <div class="tracker-progress" style="width:${trackerProgress}%"></div>
                    <div class="tracker-step active">
                        <div class="tracker-dot"></div>
                        <div class="tracker-step-title">Requested</div>
                    </div>
                    <div class="tracker-step ${trackerProgress > 33 ? 'active':''}" style="left:33%">
                        <div class="tracker-dot"></div>
                        <div class="tracker-step-title">In Progress</div>
                    </div>
                    <div class="tracker-step ${trackerProgress > 66 ? 'active':''}" style="left:66%">
                        <div class="tracker-dot"></div>
                        <div class="tracker-step-title">Quality Check</div>
                    </div>
                    <div class="tracker-step ${trackerProgress === 100 ? 'active':''}" style="left:100%">
                        <div class="tracker-dot"></div>
                        <div class="tracker-step-title">Shipped Back</div>
                    </div>
                </div>
                <div style="margin-top:30px">
                    <button class="btn" onclick="advanceTracker()">Advance Tracker (Simulate)</button>
                    <button class="btn" onclick="routeTo('wardrobe')">Send New Request</button>
                </div>
            </div>
        </div>
        
        <div style="margin-top:20px" class="card">
            <h4>RePoints Goals</h4>
            <div class="grid cols-2" style="margin-top:10px">
                <div>
                    <strong>${refurbGoal.title}</strong>
                    <div class="muted">${refurbGoal.current} / ${refurbGoal.target} complete</div>
                    <div class="goal-bar"><div class="goal-progress" style="width:${refurbProgress}%"></div></div>
                </div>
                <div>
                    <strong>${wearGoal.title}</strong>
                    <div class="muted">Currently tracking ${state.wardrobe.filter(i => (i.worn || 0) >= 5).length} items</div>
                    <div class="goal-bar"><div class="goal-progress" style="width:${Math.min(100, (state.wardrobe.filter(i => (i.worn || 0) >= 5).length / wearGoal.target) * 100)}%"></div></div>
                </div>
            </div>
        </div>
    `;
}

function advanceTracker() {
    if(state.refurbRequests.length === 0){
        return alert('No refurbish requests to track!');
    }
    const req = state.refurbRequests[state.refurbRequests.length-1];
    
    if(req.statusIndex < 4){
        req.statusIndex++;
        const statuses = ['Requested', 'In Progress', 'Quality Check', 'Shipped Back'];
        req.status = statuses[req.statusIndex - 1];
        alert(`Refurbish Request Status updated to: ${req.status}`);
        saveData(state);
    } else {
        alert('Request already Shipped Back.');
    }
    render();
}

/* ---------- Community ---------- */
function renderCommunity(root) {
    root.innerHTML = `
        <div class="card">
            <h3>Community Feed</h3>
            <div class="muted">Share your style and see recent posts.</div>
            <div style="margin-top:10px">
                <textarea id="newPost" placeholder="Share your sustainable style or a repair tip..." rows="3"></textarea>
                <button class="btn primary" style="margin-top:8px" onclick="postToCommunity()">Post</button>
            </div>
        </div>
        
        <div style="margin-top:12px" id="communityFeed">
            ${state.community.length === 0 ? '<div class="card">No posts yet. Be the first to share!</div>' : state.community.map(p => `
                <div class="card" style="margin-bottom:10px">
                    <div class="small-muted">Posted ${humanTime(p.timestamp)} ago</div>
                    <p style="margin-top:5px">${p.content}</p>
                </div>
            `).join('')}
        </div>
    `;
}

function postToCommunity() {
    const content = document.getElementById('newPost').value.trim();
    if (content) {
        state.community.unshift({ id: uid('cm'), content: content, timestamp: Date.now() });
        saveData(state);
        document.getElementById('newPost').value = '';
        render();
    }
}

    root.innerHTML = `
        <div class="card">
            <h3>Sustainability Tips</h3>
            <div class="muted">Quick guides to extend the life of your clothes and reduce your impact.</div>
        </div>
        <div style="margin-top:12px">
            ${state.tips.map(t => `

}

/* ---------- About ---------- */
function renderAbout(root) {
    root.innerHTML = `
        <div class="card">
            <h3>About ReVogue</h3>
            <p>ReVogue is a platform dedicated to circular fashion. We believe in extending the life of every garment through buying second-hand, refurbishment, and conscious use.</p>
            <p style="margin-top:10px">Our mission is to reduce textile waste and promote sustainable consumption habits.</p>
        </div>
    `;
}

/* ---------- Product Detail Modal & Logic ---------- */
function openDetail(id) {
    const p = state.products.find(x => x.id === id);
    if (!p) return;

    const modalContent = `
        <div class="space-between">
            <h2>${p.title}</h2>
            <div class="price">${formatPrice(p.price)}</div>
        </div>
        <div style="margin-top:10px">
            <div style="background-image:url('${p.img}');height:200px;background-size:cover;background-position:center;border-radius:8px;"></div>
        </div>
        
        <h4 style="margin-top:15px">Fabric Story (Sustainability Impact)</h4>
        <p class="muted">${p.fabric}</p>
        <p class="small-muted">Water Saved: ${p.saved_water_liters}L | CO₂ Offset: ${p.co2_saved_kg}kg | Wear Cycles Remaining: ${p.life}</p>
        
        <h4 style="margin-top:15px">Care Instructions</h4>
        <p class="muted">${p.care}</p>

        <div style="margin-top:20px;display:flex;gap:10px">
            <button class="btn primary" onclick="addToWardrobe('${p.id}');closeModal()">Buy & Track</button>
            <button class="btn secondary" onclick="closeModal()">Close</button>
        </div>
    `;
    showModal(modalContent);
}

function showModal(content){
    let overlay = document.getElementById('modalOverlay');
    if(!overlay){
        overlay = document.createElement('div');
        overlay.id = 'modalOverlay';
        document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="modal-content">${content}</div>`;
    overlay.style.display = 'flex';
}
function closeModal(){
    const modal = document.getElementById('modalOverlay');
    if(modal) modal.style.display = 'none';
}


// FIX: This listener is REQUIRED for header navigation links to work after hash change
window.addEventListener('hashchange', render);

// Initial render
render();
</script>

</html>
